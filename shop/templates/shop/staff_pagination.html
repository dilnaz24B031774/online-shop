{% if page_obj %}<div class="pagination"><span>Всего: {{ page_obj.paginator.count }} · Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_other_pages %}<nav class="pagination-links" aria-label="Страницы списка">{% if page_obj.has_previous %}<a class="button secondary small" href="{% querystring page=page_obj.previous_page_number %}">← Назад</a>{% endif %}{% if page_obj.has_next %}<a class="button secondary small" href="{% querystring page=page_obj.next_page_number %}">Далее →</a>{% endif %}</nav>{% endif %}</div>{% endif %}
